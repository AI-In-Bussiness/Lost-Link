name: Security checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '25 9 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check locked dependencies for known vulnerabilities
        run: npm audit --package-lock-only --audit-level=high
      - name: Scan complete Git history for secrets with redacted output
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          python - "$RUNNER_TEMP/gitleaks.tar.gz" <<'PY'
          import hashlib, pathlib, sys
          assert hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest() == '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          PY
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts=--all .
