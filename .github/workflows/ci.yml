name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The default public ECR endpoint rate-limits fresh hosted runners.
      # Use Supabase's public GHCR mirror with the same CLI-pinned image tags.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/phase2/requirements.txt
      - run: npm ci --prefix tools/phase2
      - run: python -m pip install -r tools/phase2/requirements.txt
      - run: npm run db:start
      - run: npm run env:local
      - run: npm run env:photos
      - run: npm run model:download
      - run: npm run test:search:model
      - run: npm run eval:search
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:release
      - run: npm run test:mocks
      - run: npm run db:test
      - run: npm run test:demo
      # Account/data readiness does not depend on downloading browser packages.
      - run: python -m playwright install --with-deps chromium
      - run: npm run build
      - run: npm run check:search:bundle
      - run: npm run test:live
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persisted-browser-evidence
          path: /tmp/lostlink-live-*.png
          if-no-files-found: ignore
      - if: always()
        run: npm run db:stop
