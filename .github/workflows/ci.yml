name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
  packages: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Use the CLI's original upstream images; both mirror registries can throttle.
      # The CLI preserves its pinned versions and upstream repository names.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/phase2/requirements.txt
      - run: npm ci --prefix tools/phase2
      - run: python -m pip install -r tools/phase2/requirements.txt
      - name: Authenticate read-only GHCR image pulls
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start Supabase with official-registry rate-limit recovery
        shell: bash
        run: |
          for registry in docker.io ghcr.io public.ecr.aws; do
            if SUPABASE_INTERNAL_IMAGE_REGISTRY="$registry" npm run db:start 2> /tmp/lostlink-db-start.log; then
              cat /tmp/lostlink-db-start.log
              exit 0
            fi
            cat /tmp/lostlink-db-start.log >&2
            if ! grep -Eqi 'toomanyrequests|too many requests|429 Too Many Requests' /tmp/lostlink-db-start.log; then
              exit 1
            fi
            # Retry only registry throttling, keeping all pinned versions.
            # SQL/startup/assertion failures still fail; no database is reset.
          done
          exit 1
      - run: npm run env:local
      - run: npm run env:photos
      - run: npm run test:model-download
      - run: npm run model:download
      - run: npm run test:search:model
      - run: npm run eval:search
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:release
      - run: npm run test:mocks
      - run: npm run db:test
      - run: npm run test:demo
      # Account/data readiness does not depend on downloading browser packages.
      - run: python -m playwright install --with-deps chromium
      - run: npm run build
      - run: npm run check:search:bundle
      - run: npm run test:search:relevance
      - run: npm run test:live
      - run: npm run test:browser
      - run: npm run test:admin
      - run: npm run test:password-reset
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persisted-browser-evidence
          path: /tmp/lostlink-live-*.png
          if-no-files-found: ignore
      - if: always()
        run: npm run db:stop
