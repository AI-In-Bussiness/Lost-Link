name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The default public ECR endpoint rate-limits fresh hosted runners.
      # Use Supabase's public GHCR mirror with the same CLI-pinned image tags.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run env:local
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:mocks
      - run: npm run db:test
      - run: npm run build
      - run: npm run test:live
      - if: always()
        run: npm run db:stop
